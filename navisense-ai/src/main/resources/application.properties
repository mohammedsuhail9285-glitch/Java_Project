spring.application.name=navisense-ai
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:navisensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.sih.navisense=INFO
logging.level.org.springframework.web=INFO

# NaviSense Domain & Algorithm Parameters
navisense.currency.usd-inr=85.50
navisense.bunker.fuel-price-usd=620.00
navisense.demurrage.daily-rate-usd=18500.00
navisense.port.tariff-per-tonne-usd=3.25

# Forecast Ensemble Weights
navisense.forecast.weights.exp-smoothing=0.35
navisense.forecast.weights.linear-trend=0.30
navisense.forecast.weights.weighted-moving-avg=0.25
navisense.forecast.weights.seasonality=0.10
navisense.forecast.smoothing-alpha=0.35

# Contract Strategy Discount Assumptions (vs average spot)
navisense.contract.short-term-discount=0.045
navisense.contract.medium-term-discount=0.080

# Risk Multi-Factor Weights
navisense.risk.weights.volatility=0.25
navisense.risk.weights.congestion=0.25
navisense.risk.weights.compatibility=0.15
navisense.risk.weights.route=0.15
navisense.risk.weights.uncertainty=0.10
navisense.risk.weights.idle-time=0.10
