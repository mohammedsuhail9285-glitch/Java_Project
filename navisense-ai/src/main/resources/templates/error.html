<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Notification — NAVISENSE AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="watchfloor-layout">
  <!-- Sidebar Navigation -->
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Main Content Area -->
  <main class="watchfloor-main">
    <!-- Top Watch Bar -->
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="watchfloor-content">
      <div class="py-5 text-center">
        <div class="wf-card p-5 mx-auto" style="max-width: 650px;">
          <div class="fs-1 text-warning mb-3">⚠️</div>
          <h3 class="fw-bold text-dark mb-2">Operational Boundary Handled</h3>
          <p class="text-muted mb-4" th:text="${errorMessage}">
            The system encountered an input validation or calculation constraint.
          </p>

          <div th:if="${errorDetails}" class="p-3 bg-light rounded border text-start small font-mono text-danger mb-4" style="max-height: 150px; overflow-y: auto;" th:text="${errorDetails}">
            Details
          </div>

          <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/dashboard}" class="btn-watchfloor-primary px-4">
              Return to Watchfloor
            </a>
            <a th:href="@{/charter}" class="btn-watchfloor-outline px-4">
              New Charter Analysis
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
