server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: lmchecker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_TLS_ENABLE:true}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 30000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  oauth2:
    default-role: ${APP_OAUTH2_DEFAULT_ROLE:VIEWER}
    redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI:http://localhost:3000/oauth2/callback}
    login-url: ${FRONTEND_LOGIN_URL:http://localhost:3000/login}
    google:
      client-id: ${GOOGLE_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID:}}
      client-secret: ${GOOGLE_CLIENT_SECRET:${GOOGLE_OAUTH_CLIENT_SECRET:}}
      redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
      client-authentication-method: ${GOOGLE_CLIENT_AUTH_METHOD:client_secret_basic}
  otp:
    delivery-mode: ${OTP_DELIVERY_MODE:demo}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.springframework.security.oauth2: TRACE
    org.springframework.web.client: DEBUG